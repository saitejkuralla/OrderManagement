<div class="page-header">
  <h1>Products</h1>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> Add Product
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search</mat-label>
  <input matInput [(ngModel)]="searchTerm" placeholder="Name or SKU" />
</mat-form-field>

@if (!loading && filteredProducts.length === 0) {
  <app-empty-state message="No products found." icon="inventory_2"></app-empty-state>
} @else {
  <table mat-table [dataSource]="filteredProducts">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let p">{{ p.name }}</td>
    </ng-container>
    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let p">{{ p.sku }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let p">{{ p.price | number: '1.2-2' }}</td>
    </ng-container>
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let p">
        <mat-icon [class.active-icon]="p.isActive" [class.inactive-icon]="!p.isActive">
          {{ p.isActive ? 'check_circle' : 'cancel' }}
        </mat-icon>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
